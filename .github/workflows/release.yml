name: Release

# Push a tag like v0.1.0 (matching the version in package.json) to publish a
# GitHub Release. It carries:
#   - taria-<os>-<arch>.tar.gz  standalone binaries built on native runners
#   - taria-<version>.tgz       the npm package
#   - SHA256SUMS                 checksums of all of the above (used by install.sh)
# The release notes are that version's section of CHANGELOG.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Build provenance attestations for the release assets (actions/attest-build-provenance).
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check the committed bundle is up to date
        run: |
          npm run build
          git diff --stat --exit-code -- dist

      - name: Type-check, lint and test
        run: |
          npm run typecheck
          npm run lint
          npm test

  binaries:
    needs: verify
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the packaged assets (binaries, npm package, SHA256SUMS)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: List the assets
        run: ls -l assets && cat assets/SHA256SUMS

      - name: Attest build provenance
        # Records, signed by GitHub, which workflow run built each file from
        # which commit. Check a download with:
        #   gh attestation verify taria-linux-x64.tar.gz --repo Riloative/taria
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/taria-*.tar.gz
            assets/taria-*.tgz
            assets/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "taria $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
