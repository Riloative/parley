name: Release

# Push a tag like v0.1.0 (matching the version in package.json) to publish a
# GitHub Release. It carries:
#   - taria-<os>-<arch>.tar.gz  standalone binaries built on native runners
#                                (each also holds the 0.3.x `parley` alias)
#   - taria-<version>.tgz       the npm package
#   - SHA256SUMS                 checksums of all of the above (used by install.sh)
# The release notes are that version's section of CHANGELOG.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check the committed bundle is up to date
        run: |
          npm run build
          git diff --stat --exit-code -- dist

      - name: Type-check, lint and test
        run: |
          npm run typecheck
          npm run lint
          npm test

  binaries:
    needs: verify
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the packaged assets (binaries, npm package, SHA256SUMS)
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: assets

      - name: List the assets
        run: ls -l assets && cat assets/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "taria $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
