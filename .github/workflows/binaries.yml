name: Binaries

# Builds the standalone executable on a native runner for each target, runs
# the whole PTY suite and the CLI smoke checks against it, installs it with
# install.sh from a local release layout, and uploads the packaged archive.
# Called by CI on every push and pull request, and by the release workflow,
# so the release path is exercised before any tag exists.

on:
  workflow_call:

jobs:
  build:
    name: binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Node here only runs the build script and the tests; the runtime
      # embedded in the binary is pinned in scripts/binary-runtime.json.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install tmux (for the tmux rendering test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci

      - name: Build the binary
        run: node scripts/build-binary.mjs

      - name: Check the archive and the binary
        shell: bash
        run: |
          test -f "build/bin/taria-${{ matrix.target }}.tar.gz"
          # The archive holds taria and, for 0.3.x, the parley alias.
          [ "$(tar -tzf "build/bin/taria-${{ matrix.target }}.tar.gz" | sort | tr '\n' ' ')" = "parley taria " ]
          file build/bin/taria
          ls -l build/bin
          build/bin/taria --version
          build/bin/taria --version | grep -q "standalone binary, Node v$(node -p "require('./scripts/binary-runtime.json').node"), ${{ matrix.target }})"

      - name: Minimum glibc required (Linux)
        if: runner.os == 'Linux'
        run: |
          objdump -T build/bin/taria | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          objdump -T build/bin/taria | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1

      - name: Runs on the oldest supported glibc (AlmaLinux 8, glibc 2.28), not older (Ubuntu 18.04, glibc 2.27)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The Node runtime also needs libatomic, which minimal images lack.
          # Rather than install it from distribution mirrors inside the
          # containers (an AlmaLinux mirror outage once failed this step after
          # half an hour), mount the runner's own copy. It needs only glibc
          # 2.14, so the checks still measure taria's own glibc floor.
          lib="$(ldconfig -p | awk '/libatomic.so.1 /{print $NF; exit}')"
          if [ -z "$lib" ]; then
            sudo apt-get install -y -qq libatomic1
            lib="$(ldconfig -p | awk '/libatomic.so.1 /{print $NF; exit}')"
          fi
          echo "libatomic: $lib needs $(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          mkdir -p "$RUNNER_TEMP/atomic"
          cp -L "$lib" "$RUNNER_TEMP/atomic/libatomic.so.1"
          bin=(-v "$PWD/build/bin:/b:ro")
          atomic=(-v "$RUNNER_TEMP/atomic:/atomic:ro" -e LD_LIBRARY_PATH=/atomic)
          if docker run --rm "${bin[@]}" almalinux:8 /b/taria --version 2>&1 | grep -q libatomic; then
            echo "AlmaLinux 8 without libatomic: fails naming libatomic, as documented"
          fi
          docker run --rm "${bin[@]}" "${atomic[@]}" almalinux:8 sh -c 'ldd --version | head -1; /b/taria --version && echo hi | /b/taria -p -m mock/echo say'
          if docker run --rm "${bin[@]}" "${atomic[@]}" ubuntu:18.04 /b/taria --version > old.txt 2>&1; then
            echo "Unexpectedly ran on glibc 2.27; update the documented minimum" >&2
            exit 1
          fi
          cat old.txt
          grep -q 'GLIBC_2.2[0-9].*required by /b/taria' old.txt

      - name: Signature (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --verbose build/bin/taria && codesign -dv build/bin/taria 2>&1 | head -5

      - name: Smoke checks
        shell: bash
        run: |
          export TARIA_NO_KEYCHAIN=1
          out="$(echo hi | build/bin/taria -p -m mock/echo say)"
          [ "$out" = "$(printf 'You said: hi\n\nsay')" ]
          build/bin/taria doctor | tee doctor.txt || true
          grep -q 'Install method         standalone binary' doctor.txt

      - name: PTY suite against the binary
        run: npx vitest run test/pty
        env:
          TARIA_BIN: ${{ github.workspace }}/build/bin/taria

      - name: Start-up time (binary and Node build)
        run: |
          node scripts/bench-startup.mjs --runs 20 --bin build/bin/taria
          npm run build
          node scripts/bench-startup.mjs --runs 20

      - name: install.sh against this build
        shell: bash
        run: |
          rel="$RUNNER_TEMP/releases/latest/download"
          mkdir -p "$rel"
          cp "build/bin/taria-${{ matrix.target }}.tar.gz" "$rel/"
          (cd "$rel" && (sha256sum taria-*.tar.gz 2>/dev/null || shasum -a 256 taria-*.tar.gz) > SHA256SUMS)
          TARIA_RELEASES_URL="file://$RUNNER_TEMP/releases" TARIA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/taria" --version | grep -q 'standalone binary'
          # The parley alias runs the same binary, after one line on stderr.
          [ "$("$RUNNER_TEMP/bin/parley" --version 2>/dev/null)" = "$("$RUNNER_TEMP/bin/taria" --version)" ]
          "$RUNNER_TEMP/bin/parley" --version 2>&1 >/dev/null | grep -q 'parley is now taria'

      - uses: actions/upload-artifact@v5
        with:
          name: taria-${{ matrix.target }}
          path: build/bin/taria-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: package release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the binaries
        uses: actions/download-artifact@v5
        with:
          pattern: taria-*
          path: assets
          merge-multiple: true

      - name: Pack the npm package
        run: npm pack --pack-destination assets

      - name: Checksums
        working-directory: assets
        run: |
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do test -f "taria-$t.tar.gz"; done
          sha256sum taria-*.tar.gz taria-*.tgz > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: install.sh against the assembled release
        run: |
          mkdir -p "$RUNNER_TEMP/releases/latest"
          cp -r assets "$RUNNER_TEMP/releases/latest/download"
          TARIA_RELEASES_URL="file://$RUNNER_TEMP/releases" TARIA_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/taria" --version

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 14
