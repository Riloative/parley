name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, lts/*]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install tmux (for the tmux rendering test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and check the committed bundle is up to date
        run: |
          npm run build
          git diff --stat --exit-code -- dist || (echo "dist/ is stale: run 'npm run build' and commit it" && exit 1)

      - name: Test
        run: npm test

      - name: Global install smoke test (npm install -g .)
        run: |
          npm install -g .
          parley --version
          parley --help > /dev/null
          out="$(echo hi | parley -p -m mock/echo say)"
          [ "$out" = "$(printf 'You said: hi\n\nsay')" ]
          parley doctor || true
