name: CI

on:
  # Branches only: a version tag runs the same checks in release.yml.
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, lts/*]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install tmux (for the tmux rendering test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and check the committed bundle is up to date
        run: |
          npm run build
          git diff --stat --exit-code -- dist || (echo "dist/ is stale: run 'npm run build' and commit it" && exit 1)

      - name: Test
        run: npm test

      - name: Global install smoke test (npm install -g .)
        run: |
          npm install -g .
          taria --version
          taria --help > /dev/null
          out="$(echo hi | taria -p -m mock/echo say)"
          [ "$out" = "$(printf 'You said: hi\n\nsay')" ]
          taria doctor || true
          # The parley alias (0.3.x only): same output, a notice on stderr.
          [ "$(parley --version 2>/dev/null)" = "$(taria --version)" ]
          parley --version 2>&1 >/dev/null | grep -q 'parley is now taria'

  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --version && shellcheck -s sh install.sh

  binaries:
    uses: ./.github/workflows/binaries.yml
